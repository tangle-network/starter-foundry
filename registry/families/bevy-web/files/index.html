<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{serviceName}}</title>
    <!-- Trunk directives: `data-trunk` tells Trunk to build the Rust crate
         to WASM, run wasm-bindgen, and inject the loader script here. -->
    <link data-trunk rel="rust" data-wasm-opt="z" />
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #0b0d10; overflow: hidden; }
      canvas { display: block; outline: none; }
      #loading { position: fixed; inset: 0; display: grid; place-items: center; color: #e7ecf3; font: 14px/1.5 ui-monospace, Menlo, monospace; }
    </style>
  </head>
  <body>
    <div id="loading">Compiling Bevy WASM…</div>
    <script>
      // Bevy creates its canvas on load; hide the loading overlay as
      // soon as the canvas appears.
      const observer = new MutationObserver(() => {
        if (document.querySelector('canvas')) {
          document.getElementById('loading')?.remove();
          observer.disconnect();
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });
    </script>
  </body>
</html>
