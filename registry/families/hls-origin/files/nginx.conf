worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  tcp_nopush    on;
  tcp_nodelay   on;
  keepalive_timeout 65;

  # HLS-specific MIME overrides. nginx's default mime.types has these but some
  # distros ship an old copy; declaring them explicitly is cheap insurance.
  types {
    application/vnd.apple.mpegurl  m3u8;
    video/mp2t                     ts;
    video/iso.segment              m4s;
    application/dash+xml           mpd;
  }

  # Gzip helps for .m3u8 playlists (text). Do NOT gzip .ts segments — ffmpeg
  # already emits them at the target bitrate, and re-compression just burns CPU.
  gzip on;
  gzip_types application/vnd.apple.mpegurl;

  server {
    listen 80;
    server_name _;

    # Match any origin so browser HLS.js / Safari native player can pull the
    # playlist cross-origin. Tighten in production to your known host list.
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Range" always;
    add_header Access-Control-Expose-Headers "Content-Length, Content-Range" always;

    # The playlist rewrites every segment; clients poll it ~every
    # target-duration seconds. Cache-bust it aggressively so players never
    # see a stale window.
    location ~ \.m3u8$ {
      root /var/www;
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
      add_header Access-Control-Allow-Origin "*" always;
      expires -1;
    }

    # Segments are immutable once written — safe to cache for the playlist
    # lifetime. 10s matches the default rolling window size.
    location ~ \.(ts|m4s)$ {
      root /var/www;
      add_header Cache-Control "public, max-age=10" always;
      add_header Access-Control-Allow-Origin "*" always;
    }

    location /hls/ {
      root /var/www;
      autoindex off;
    }

    location = /healthz {
      return 200 "ok\n";
      add_header Content-Type text/plain;
    }
  }
}
