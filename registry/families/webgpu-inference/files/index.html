<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{serviceName}}</title>
    <style>
      html, body { margin: 0; padding: 0; min-height: 100%; background: #0b0d10; color: #e7ecf3; font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
      main { max-width: 880px; margin: 0 auto; padding: 32px 24px; }
      h1 { font-size: 18px; margin: 0 0 12px; color: #6ea8ff; }
      #status { padding: 8px 12px; border: 1px solid #2a3240; border-radius: 6px; background: #11161d; margin: 12px 0; }
      #output { white-space: pre; padding: 12px; border: 1px solid #2a3240; border-radius: 6px; background: #11161d; overflow-x: auto; }
      .err { color: #ff8080; }
      .ok { color: #7bd88f; }
    </style>
  </head>
  <body>
    <main>
      <h1>WebGPU Inference Starter</h1>
      <div id="status">Initializing WebGPU…</div>
      <pre id="output"></pre>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
