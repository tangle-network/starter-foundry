# Trunk config — the standard Bevy-web build tool. Wraps wasm-bindgen +
# wasm-opt and serves the page. `trunk serve` for dev, `trunk build
# --release` for production.

[build]
target = "index.html"
dist = "dist"
# Relative public_url lets the bundle be served from any subpath, which
# matters for static hosts that deploy under /project-name/.
public_url = "./"

[serve]
addresses = ["127.0.0.1"]
port = 8080
open = false

[[hooks]]
stage = "post_build"
command = "sh"
command_arguments = ["-c", "echo 'bevy-web build complete — dist/ ready to serve'"]
