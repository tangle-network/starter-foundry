name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'drew/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build + test
    runs-on: [self-hosted, ci-linux]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: install Rust toolchain for cargo-backed scaffold tests
        uses: dtolnay/rust-toolchain@stable

      - name: reap stale anvil (shared-runner foundryup guard)
        # foundryup refuses to install while an anvil process is alive; on the
        # shared self-hosted runner a prior job's anvil can linger and bail this
        # install. Clear it before foundry-toolchain runs.
        run: pkill -9 -f '/anvil( |$)' 2>/dev/null || true

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: install
        run: pnpm install --frozen-lockfile

      - name: validate registry manifests (schemas + keyword overlap + dangling appliesTo)
        run: pnpm exec tsx scripts/validate-registry.ts

      - name: measurement delta (only when registry/ changes)
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin main
          CHANGED=$(git diff --name-only origin/main...HEAD | grep '^registry/' || true)
          if [ -z "$CHANGED" ]; then
            echo "no registry/ changes — skipping delta report"
            exit 0
          fi
          pnpm build
          pnpm exec tsx scripts/refresh-scorecard.ts
          pnpm exec tsx scripts/pr-measurement-delta.ts --base origin/main --out .evolve/pr-delta.md || echo "⚠ regressions detected; see PR comment"
          cat .evolve/pr-delta.md
        continue-on-error: true

      - name: typecheck + build
        run: pnpm build

      - name: gen17 invariants — bare-alias scan, profile coherence, cost ceiling
        run: |
          pnpm exec tsx scripts/check-bare-alias.ts
          pnpm exec tsx scripts/check-profile-coherence.ts
          pnpm exec tsx scripts/check-run-cost-ceiling.ts

      - name: unit + integration tests
        # Serial test execution enforced in package.json (workspace benchmarks
        # + http-start validation checks reserve ephemeral ports and race
        # under parallel execution).
        run: pnpm test

  matrix-eval:
    name: router matrix eval (deterministic, no key)
    runs-on: [self-hosted, ci-linux]
    timeout-minutes: 10
    needs: build-test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: install
        run: pnpm install --frozen-lockfile

      - name: build
        run: pnpm build

      - name: matrix eval (brief path no-ops without API key — measures deterministic baseline)
        run: |
          pnpm exec tsx scripts/meta-harness-eval.ts \
            --out .evolve/meta-harness/runs/ci-baseline.jsonl \
            --label ci-baseline

      - name: assert CI thresholds
        run: |
          node -e '
            const fs = require("node:fs");
            const lines = fs.readFileSync(".evolve/meta-harness/runs/ci-baseline.jsonl", "utf8").trim().split("\n");
            const agg = JSON.parse(lines[lines.length - 1]);
            const ideasai = agg.perCorpus["ideasai"];
            const heldOut = agg.perCorpus["held-out"];
            const vibe = agg.perCorpus["vibecoder"];
            const fail = [];
            // Route accuracy must stay at the current deterministic baseline.
            if (agg.passRate < 0.99) fail.push(`passRate ${agg.passRate} < 0.99`);
            if (heldOut.passRate < 1.0) fail.push(`held-out passRate ${heldOut.passRate} < 1.0`);
            if (vibe.passRate < 1.0) fail.push(`vibecoder passRate ${vibe.passRate} < 1.0`);
            // Recall: held-out must stay perfect, ideasai must not slip below the
            // recorded baseline of 0.878 minus a 2pp tolerance band.
            if (heldOut.meanRecall !== undefined && heldOut.meanRecall < 1.0) fail.push(`held-out recall ${heldOut.meanRecall} < 1.0`);
            if (ideasai.meanRecall !== undefined && ideasai.meanRecall < 0.85) fail.push(`ideasai recall ${ideasai.meanRecall} < 0.85 (baseline 0.878)`);
            // Latency is noisy on shared self-hosted runners. Keep accuracy and
            // recall as hard gates; record p95 for trend review and only fail
            // on a catastrophic deterministic-path slowdown.
            if (agg.p95Ms > 5) console.warn(`p95 ${agg.p95Ms}ms > 5ms advisory latency budget`);
            if (agg.p95Ms > 25) fail.push(`p95 ${agg.p95Ms}ms > 25ms catastrophic latency budget`);
            if (fail.length) {
              console.error("CI threshold failures:");
              for (const f of fail) console.error("  - " + f);
              process.exit(1);
            }
            console.log("thresholds OK:", JSON.stringify({
              passRate: agg.passRate,
              ideasaiRecall: ideasai.meanRecall,
              heldOutRecall: heldOut.meanRecall,
              p95Ms: agg.p95Ms,
            }, null, 2));
          '

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matrix-eval-result
          path: .evolve/meta-harness/runs/ci-baseline.jsonl
          retention-days: 14
