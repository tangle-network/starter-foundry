[project]
name = "starter-foundry"
version = "0.1.0"
description = "Python SDK for starter-foundry — deterministic scaffold engine for AI coding platforms"
authors = [{name = "Tangle Network"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://github.com/tangle-network/starter-foundry"
Issues = "https://github.com/tangle-network/starter-foundry/issues"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["starter_foundry*"]
