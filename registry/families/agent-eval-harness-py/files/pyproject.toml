[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-eval-harness-py"
version = "0.1.0"
description = "Python eval harness for agent-under-test scoring; emits cross-language-compatible scorecard.json and gates regressions with bootstrap CI + Cohen's d + Welch's t-test."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Tangle" }]
license = { text = "MIT" }
keywords = ["agent-eval", "llm-as-judge", "regression-gate", "tangle-sandbox"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "tangle-sandbox>=0.1",
  "httpx>=0.27",
  "pydantic>=2.6",
  "numpy>=1.26",
  "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[project.scripts]
eval-harness = "eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src", "."]
