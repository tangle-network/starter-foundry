<!doctype html>
<html lang="{{ .Site.LanguageCode }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ .Title | default .Site.Title }}</title>
    <style>
      body { font-family: ui-sans-serif, system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; color: #0f172a; }
      header { border-bottom: 1px solid #e2e8f0; margin-bottom: 1.5rem; padding-bottom: 1rem; }
      h1 { margin: 0 0 .25rem; }
    </style>
  </head>
  <body>
    <header>
      <h1>{{ .Site.Title }}</h1>
      <p>{{ .Site.Params.subtitle }}</p>
    </header>
    <main>
      {{ block "main" . }}{{ end }}
    </main>
  </body>
</html>
