[package]
name = "arkworks-prover"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[[bin]]
name = "arkworks-prover"
path = "src/main.rs"

[dependencies]
ark-ff = "0.5"
ark-ec = "0.5"
ark-bn254 = "0.5"
ark-relations = "0.5"
ark-r1cs-std = "0.5"
ark-groth16 = "0.5"
ark-snark = "0.5"
ark-std = { version = "0.5", features = ["std"] }
ark-serialize = "0.5"
anyhow = "1"

[profile.release]
lto = true
codegen-units = 1
