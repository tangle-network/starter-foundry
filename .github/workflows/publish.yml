name: Release

# Publishes @tangle-network/starter-foundry to GitHub Packages on git tag push.
#
# Proprietary — All Rights Reserved. The package is intentionally NOT
# published to public npmjs.org. Internal consumers (blueprint-agent,
# agent-dev-container, etc.) route the @tangle-network scope to
# https://npm.pkg.github.com/ via .npmrc.
#
# Prior versions 0.4.0–0.7.3 are on public npm under MIT (perpetual
# grant — cannot be revoked). v0.8.0 onward is proprietary on
# GitHub Packages only.
#
# Authentication uses the workflow's GITHUB_TOKEN automatically via
# the registry-url override; no long-lived secret needed.
#
# To cut a release:
#   1. Bump version in package.json
#   2. git commit -am "chore: release v0.8.1"
#   3. git tag v0.8.1
#   4. git push origin main --tags
# The workflow handles the rest.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to publish (e.g. v0.5.0)'
        required: true

permissions:
  contents: write # for creating the github release
  id-token: write # for npm provenance attestation
  packages: write # for publishing to GitHub Packages

jobs:
  publish:
    name: Publish to GitHub Packages
    runs-on: [self-hosted, staging-runner]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Install deps from public npm — @tangle-network/agent-eval and
      # @tangle-network/tcloud-agent live on npmjs.org. Switching the
      # default registry to GH Packages here would 404 on those.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm install

      - name: Verify version matches tag
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_VERSION="${{ github.event.inputs.tag }}"
            TAG_VERSION="${TAG_VERSION#v}"
          fi
          echo "package.json version: $PKG_VERSION"
          echo "tag version:          $TAG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Pack (verify the tarball is sane before publishing)
        run: |
          npm pack
          ls -la *.tgz

      # Switch the default registry + auth to GH Packages only for the
      # publish step. Done after install so dep resolution from
      # npmjs.org isn't disturbed.
      - name: Configure Node for GitHub Packages
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@tangle-network'

      - name: Publish to GitHub Packages
        # Idempotent on retry: skip if the version is already on gh
        # packages (e.g. a partial earlier run that succeeded here but
        # failed elsewhere). Auth uses GITHUB_TOKEN automatically via
        # the registry-url override above; no extra secret needed.
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "@tangle-network/starter-foundry@$PKG_VERSION" version --registry=https://npm.pkg.github.com/ >/dev/null 2>&1; then
            echo "@tangle-network/starter-foundry@$PKG_VERSION already on gh packages — skipping"
          else
            npm publish --registry=https://npm.pkg.github.com/
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Github release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: '*.tgz'
