name = "research-assistant"
main = "src/index.ts"
compatibility_date = "2026-04-01"

[vars]
AGENT_NAME = "research-assistant"

[[d1_databases]]
binding = "DB"
database_name = "<replace-me>"
database_id = "<replace-me>"

[[kv_namespaces]]
binding = "VAULT"
id = "<replace-me>"

[triggers]
crons = ["17 7 * * *", "17 7 * * 1"]
