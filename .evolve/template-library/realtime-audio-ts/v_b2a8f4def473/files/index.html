<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{projectName}}</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main id="app">
      <header>
        <h1>{{headline}}</h1>
        <p>{{subheadline}}</p>
      </header>
      <section class="controls">
        <button id="start" type="button">Start microphone</button>
        <button id="stop" type="button" disabled>Stop</button>
        <label>
          Gain
          <input id="gain" type="range" min="0" max="2" step="0.01" value="1" />
        </label>
        <span id="status" class="status" data-state="idle">Idle</span>
      </section>
      <canvas id="visualizer" width="720" height="180"></canvas>
      <section class="peer">
        <h2>WebRTC peer</h2>
        <p id="peer-status">Peer connection not initialized — see src/peer.ts to wire signalling.</p>
        <!-- autoplay + playsinline required for iOS Safari; srcObject is set by main.ts when a remote track arrives -->
        <audio id="remote-audio" autoplay playsinline></audio>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
