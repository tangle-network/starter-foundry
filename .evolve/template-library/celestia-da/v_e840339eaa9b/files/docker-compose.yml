services:
  node:
    image: ghcr.io/celestiaorg/celestia-node:v0.21.0-mocha
    container_name: celestia-da-node
    restart: unless-stopped
    command:
      - celestia
      - light
      - start
      - --core.ip
      - rpc-mocha.pops.one
      - --p2p.network
      - mocha-4
      - --rpc.addr
      - 0.0.0.0
      - --rpc.port
      - "26658"
      - --rpc.skip-auth=false
    environment:
      NODE_TYPE: light
      P2P_NETWORK: mocha-4
    ports:
      - "127.0.0.1:26658:26658"
    volumes:
      - ./data:/home/celestia
    healthcheck:
      test: ["CMD", "celestia", "header", "sync-state", "--url", "http://localhost:26658"]
      interval: 30s
      timeout: 10s
      retries: 5
