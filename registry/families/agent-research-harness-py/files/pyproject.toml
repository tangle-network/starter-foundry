[project]
name = "agent-research-harness"
version = "0.1.0"
description = "Python research harness — propose/screen/validate hypotheses with tangle-sandbox isolation and scipy.stats verdicts."
requires-python = ">=3.11"
dependencies = [
    "tangle-sandbox>=0.1",
    "httpx>=0.27",
    "pydantic>=2.6",
    "numpy>=1.26",
    "scipy>=1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
research = "research.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
