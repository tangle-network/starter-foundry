name = "novelist-coach"
main = "src/index.ts"
compatibility_date = "2026-04-01"

[vars]
AGENT_NAME = "novelist-coach"
LLM_ROUTER_URL = "https://router.tangle.tools"

[[d1_databases]]
binding = "DB"
database_name = "<replace-me>"
database_id = "<replace-me>"

[[kv_namespaces]]
binding = "VAULT"
id = "<replace-me>"

[triggers]
crons = ["0 14 * * *"]
