[package]
name = "{{crateName}}"
version = "0.1.0"
edition = "2021"

[lib]
# cdylib is required for wasm-bindgen output. rlib so native unit tests
# still work against the same source.
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

[profile.dev]
opt-level = 1
