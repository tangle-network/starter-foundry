name: eval-recruiter

# Gen-16: live eval against agent-runtime-recruiter-ts via the committed
# example workspace under examples/recruiter-eval-workspace. Runs on:
#   - PR touching the recruiter family, the eval layer, or the example workspace
#   - workflow_dispatch (manual)
#   - schedule (daily 06:00 UTC) — catches model drift independent of code change
#   - push to main — refresh scorecard on merge (PR-mediated, never direct push)
#
# Gating: the live LLM eval step only runs when the TANGLE_CI_ROUTER_KEY repo
# secret is set. When absent, the workflow logs a structured warning and
# exits 0 — it does NOT fail PRs. Set the secret to unlock live measurement.
#
# Gen-16.1 audit hardening:
#   CRIT A2 — `--frozen-lockfile` (committed pnpm-lock.yaml is the source
#             of truth; CI fails on drift). The lockfile is generated by
#             a bootstrap step on the cleanup branch when missing.
#   HIGH A3 — `SYNC_FAIL_ON_DRIFT=1` so a registry change that affects
#             the workspace fails CI rather than silently re-emitting.
#   HIGH A4 — `concurrency:` block prevents two pushes/cron runs from
#             racing on the on-main scorecard commit.
#   MED  C1 — on-merge scorecard refresh opens a PR (mirroring
#             scorecard-refresh.yml), no direct push to main.

on:
  pull_request:
    paths:
      - 'registry/families/agent-runtime-recruiter-ts/**'
      - 'registry/families/agent-eval-harness-ts/**'
      - 'registry/layers/agent-eval/**'
      - 'examples/recruiter-eval-workspace/**'
      - '.github/workflows/eval-recruiter.yml'
      - 'scripts/sync-example-workspaces.ts'
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'
  push:
    branches: [main]
    paths:
      - 'registry/families/agent-runtime-recruiter-ts/**'
      - 'registry/families/agent-eval-harness-ts/**'
      - 'registry/layers/agent-eval/**'
      - 'examples/recruiter-eval-workspace/**'

permissions:
  contents: write
  pull-requests: write

# Gen-16.1 audit HIGH A4 — prevent races on main + the daily cron.
# `cancel-in-progress: false` so neither commit gets killed mid-push.
concurrency:
  group: eval-recruiter-${{ github.ref }}
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: install
        run: pnpm install --frozen-lockfile
      - name: build
        run: pnpm build

      # Gen-16.1 audit HIGH A3 — fail CI when registry → workspace drifts.
      # Runs BEFORE install so a drift fails the build at the right place.
      - name: sync example workspace from registry (drift gate)
        env:
          SYNC_FAIL_ON_DRIFT: '1'
        run: pnpm exec tsx scripts/sync-example-workspaces.ts

      # Gen-16.1 audit CRIT A2 — bootstrap the example lockfile if missing.
      # The workspace now depends only on public npm packages. Keep this path
      # plain: adding a scoped GH Packages registry makes public packages such
      # as @tangle-network/agent-eval resolve from the wrong registry.
      - name: bootstrap pnpm-lock.yaml when missing
        if: hashFiles('examples/recruiter-eval-workspace/pnpm-lock.yaml') == '' && env.TANGLE_API_KEY != ''
        env:
          TANGLE_API_KEY: ${{ secrets.TANGLE_CI_ROUTER_KEY }}
        working-directory: examples/recruiter-eval-workspace
        run: |
          set -euo pipefail
          pnpm install --lockfile-only
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git config user.name "tangle-bot"
            git config user.email "bot@tangle.tools"
            git add pnpm-lock.yaml
            git commit -m "chore(eval): bootstrap recruiter-eval-workspace lockfile" || true
            git push origin HEAD:${{ github.head_ref }} || echo "::warning::could not push lockfile to PR branch"
          fi
      - name: skip bootstrap (TANGLE_CI_ROUTER_KEY not set)
        if: hashFiles('examples/recruiter-eval-workspace/pnpm-lock.yaml') == '' && env.TANGLE_API_KEY == ''
        env:
          TANGLE_API_KEY: ${{ secrets.TANGLE_CI_ROUTER_KEY }}
        run: |
          echo "::warning::TANGLE_CI_ROUTER_KEY not set — skipping lockfile bootstrap. Run 'pnpm install --lockfile-only' inside examples/recruiter-eval-workspace/ and commit pnpm-lock.yaml."

      - name: run live eval (gated on TANGLE_CI_ROUTER_KEY)
        id: live
        env:
          TANGLE_API_KEY: ${{ secrets.TANGLE_CI_ROUTER_KEY }}
          RUBRIC_JUDGE_MODEL: deepseek/deepseek-chat
        working-directory: examples/recruiter-eval-workspace
        run: |
          if [ -z "${TANGLE_API_KEY}" ]; then
            echo "::warning::TANGLE_CI_ROUTER_KEY not set as repo secret. Skipping workspace install + live eval — agent_eval_meta_pass_rate will remain 'unmeasured'. Set the secret to enable live measurement."
            echo "ran=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pnpm install --frozen-lockfile
          pnpm eval || true
          echo "ran=true" >> "$GITHUB_OUTPUT"
      - name: upload scorecard artifact
        if: steps.live.outputs.ran == 'true' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: recruiter-eval-scorecard
          path: examples/recruiter-eval-workspace/.evolve/scorecard.json
          if-no-files-found: warn

      # Gen-16.1 audit MEDIUM C1 — open a PR for review instead of
      # direct push to main. Mirrors scorecard-refresh.yml pattern. A
      # single CI flake can no longer land a regressed scorecard.json.
      - name: open scorecard PR on main + cron
        if: |
          (github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.live.outputs.ran == 'true') ||
          (github.event_name == 'schedule' && steps.live.outputs.ran == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DATE=$(date -u +%Y-%m-%d)
          mkdir -p .evolve/eval-runs/recruiter
          cp examples/recruiter-eval-workspace/.evolve/scorecard.json .evolve/eval-runs/recruiter/${DATE}.json || true
          # Refresh repo-level scorecard with the new agent_eval_meta_pass_rate value.
          pnpm exec tsx scripts/refresh-scorecard.ts || true
          if git diff --exit-code .evolve/scorecard.json .evolve/eval-runs/recruiter/${DATE}.json > /dev/null 2>&1; then
            echo "no scorecard changes — skipping PR"
            exit 0
          fi
          BRANCH="eval-recruiter/${DATE}"
          git config user.name "tangle-bot"
          git config user.email "bot@tangle.tools"
          git checkout -b "$BRANCH"
          git add .evolve/eval-runs/recruiter/${DATE}.json .evolve/scorecard.json
          git commit -m "chore(eval): recruiter scorecard ${DATE}"
          git push -u origin "$BRANCH"
          gh pr create \
            --title "eval-recruiter scorecard: ${DATE}" \
            --body "Live recruiter eval scorecard refresh — review the diff before merging." \
            --base main \
            --head "$BRANCH" \
            --label "eval-recruiter-drift" || echo "::warning::could not create PR (it may already exist)"
