# NVIDIA Triton Inference Server.
# Pin the tritonserver tag (e.g. 24.10-py3) — `latest` can break TRT engines
# that were built for a specific CUDA/TRT minor.
services:
  triton:
    image: nvcr.io/nvidia/tritonserver:latest
    container_name: {{serviceName}}
    restart: unless-stopped
    ports:
      - "{{port}}:8000"        # HTTP
      - "{{grpcPort}}:8001"    # gRPC
      - "{{metricsPort}}:8002" # Prometheus metrics
    shm_size: 1gb
    environment:
      # Log verbosity. 0 = errors, 1 = info, 2 = debug.
      TRITON_LOG_VERBOSE: "0"
    command:
      - tritonserver
      - --model-repository=/models
      - --strict-model-config=false
      - --allow-metrics=true
      # --model-control-mode=poll re-scans /models every N seconds, so you
      # can hot-add models without restarting. Use `explicit` in prod and
      # POST /v2/repository/models/<name>/load manually.
      - --model-control-mode=poll
      - --repository-poll-secs=30
    volumes:
      - ./model_repository:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v2/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
