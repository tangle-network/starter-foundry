[project]
name = "starter-triton"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "tritonclient[http]>=2.48.0",
    "numpy>=1.26.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pyright>=1.1.380",
    "ruff>=0.6.0",
]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
include = ["src"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
