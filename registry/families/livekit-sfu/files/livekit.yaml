# LiveKit SFU config. Values here are read once at server startup.
# See https://docs.livekit.io/home/self-hosting/deployment/ for full reference.

port: {{port}}
bind_addresses:
  - ""

rtc:
  # Client-facing UDP/TCP for ICE candidates.
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 60000
  # Auto-discover the external IP via STUN. In production, set use_external_ip
  # to false and hardcode node_ip to the public address — STUN discovery
  # fails inside some Kubernetes/overlay-net setups.
  use_external_ip: true

redis:
  address: 127.0.0.1:6379

# API keys → secrets for signing JWT access tokens. Secret must be ≥32 bytes.
# Rotate by adding a new key; old keys keep minting valid tokens until all
# clients have migrated. Replace both values before deploying.
keys:
  {{livekitApiKey}}: "{{livekitApiSecret}}"

# Production logging: json format so Loki/Datadog/CloudWatch parse it cleanly.
logging:
  level: info
  json: true
