[workspace]
resolver = "2"
# Program and script are separate workspace members. The program compiles to
# a RISC-V zkVM target (via `cargo prove build`); the script compiles for
# the host.
members = ["script"]
# Program is built by sp1-build, not as a workspace member — keeps its
# RISC-V target-triple from leaking into the script's build profile.
exclude = ["program"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[profile.release]
lto = true
codegen-units = 1
