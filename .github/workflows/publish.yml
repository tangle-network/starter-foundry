name: Release

# Publishes @tangle-network/starter-foundry to public npm on git tag push.
# Blueprint Agent installs this package from the public registry inside
# sandboxes, so the release destination must match package.json publishConfig.
#
# To cut a release:
#   1. Bump version in package.json
#   2. git commit -am "chore: release v0.8.1"
#   3. git tag v0.8.1
#   4. git push origin main --tags
# The workflow handles the rest.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to publish (e.g. v0.5.0)'
        required: true

permissions:
  contents: write # for creating the github release
  id-token: write # for npm provenance attestation

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install Rust toolchain for cargo-backed scaffold tests
        uses: dtolnay/rust-toolchain@stable

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify version matches tag
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_VERSION="${{ github.event.inputs.tag }}"
            TAG_VERSION="${TAG_VERSION#v}"
          fi
          echo "package.json version: $PKG_VERSION"
          echo "tag version:          $TAG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Pack (verify the tarball is sane before publishing)
        run: |
          npm pack
          ls -la *.tgz

      - name: Publish to npm
        # Idempotent on retry: a partial run may publish successfully before
        # GitHub release creation fails.
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "@tangle-network/starter-foundry@$PKG_VERSION" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "@tangle-network/starter-foundry@$PKG_VERSION already on npm — skipping"
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create Github release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: '*.tgz'
