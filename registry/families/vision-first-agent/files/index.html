<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>{{headline}}</title>
    <style>
      :root { color-scheme: dark; }
      body {
        font-family: system-ui, -apple-system, sans-serif;
        margin: 0;
        min-height: 100vh;
        background: #0a0a0a;
        color: #f2f2f2;
        display: grid;
        place-items: center;
      }
      main { width: min(720px, 100%); padding: 1.25rem; }
      h1 { margin: 0 0 0.25rem 0; font-size: 1.3rem; }
      p.sub { margin: 0 0 1.25rem 0; color: #888; }
      .stage {
        position: relative;
        aspect-ratio: 4/3;
        background: #111;
        border-radius: 12px;
        overflow: hidden;
      }
      video, canvas {
        width: 100%; height: 100%; object-fit: cover;
        position: absolute; inset: 0;
      }
      canvas#overlay { pointer-events: none; }
      .row { display: flex; gap: 0.5rem; margin-top: 1rem; }
      input[type=text] {
        flex: 1; padding: 0.75rem; font-size: 1rem;
        background: #111; color: #f2f2f2; border: 1px solid #333; border-radius: 8px;
      }
      button {
        padding: 0.75rem 1.25rem; font-size: 1rem; border: 0; border-radius: 8px;
        background: #357; color: white; cursor: pointer;
      }
      button:disabled { opacity: 0.5; cursor: wait; }
      pre#answer {
        margin-top: 1rem; padding: 1rem; background: #111; border: 1px solid #222;
        border-radius: 8px; min-height: 4rem; white-space: pre-wrap; font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>{{headline}}</h1>
      <p class="sub">{{subheadline}}</p>
      <div class="stage">
        <video id="cam" autoplay playsinline muted></video>
        <canvas id="overlay"></canvas>
      </div>
      <div class="row">
        <input id="q" type="text" placeholder="What am I looking at?" value="What am I looking at?" />
        <button id="ask">Capture + ask</button>
        <button id="flip" title="Switch camera">Flip</button>
      </div>
      <pre id="answer">Aim the camera. Type a question. Press Capture.</pre>
      <canvas id="work" hidden></canvas>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
