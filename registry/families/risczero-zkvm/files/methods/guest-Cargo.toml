# Empty `[workspace]` block opts the guest crate out of the parent
# workspace. risc0-build invokes `cargo metadata` against this manifest
# during `embed_methods`, and without an explicit opt-out cargo refuses
# because the parent Cargo.toml's `exclude = ["methods/guest"]` is not
# enough — cargo needs the guest manifest itself to declare workspace
# independence.
[workspace]

[package]
name = "guest"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "guest"
path = "src/main.rs"

[dependencies]
risc0-zkvm = { version = "2.1", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
