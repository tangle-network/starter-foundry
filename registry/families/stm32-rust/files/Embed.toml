# probe-rs configuration. `cargo embed` reads this for target + RTT config.
[default.probe]
# Auto-select the first attached probe. Pin a `usb_vid = "xxxx"` /
# `usb_pid = "yyyy"` here if the board has a specific ST-Link / CMSIS-DAP.
protocol = "Swd"
speed = 4000

[default.general]
chip = "STM32F401RETx"
# Override per-board:
# - Nucleo-F401RE: STM32F401RETx
# - STM32F4-Discovery: STM32F407VGTx
# - Black Pill: STM32F411CEUx

[default.rtt]
enabled = true
up_mode = "NoBlockSkip"
channels = [{ up = 0, down = 0, name = "defmt" }]

[default.gdb]
enabled = false

[default.flashing]
enabled = true
restore_unwritten_bytes = false
halt_afterwards = false
