<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>starter-foundry explorer</title>
  <style>
    :root { --fg: #111; --muted: #666; --bg: #fff; --accent: #0f62fe; --border: #e5e5e5; --code-bg: #f4f4f4; }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #eee; --muted: #999; --bg: #1a1a1a; --accent: #4d8cff; --border: #333; --code-bg: #242424; }
    }
    body { font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--fg); background: var(--bg); margin: 0; padding: 2rem; max-width: 1200px; margin: 0 auto; }
    h1 { font-size: 1.6rem; margin: 0 0 0.5rem 0; }
    p.sub { color: var(--muted); margin: 0 0 1.5rem 0; }
    input[type="search"] { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 6px; background: var(--code-bg); color: var(--fg); font-size: 14px; box-sizing: border-box; }
    .tabs { display: flex; gap: 4px; margin: 1.5rem 0 1rem; border-bottom: 1px solid var(--border); }
    .tab { padding: 8px 16px; cursor: pointer; border-bottom: 2px solid transparent; color: var(--muted); }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
    .card { border: 1px solid var(--border); border-radius: 6px; padding: 12px; cursor: pointer; transition: border-color 0.15s; }
    .card:hover { border-color: var(--accent); }
    .card h3 { font-size: 14px; margin: 0 0 4px 0; font-family: ui-monospace, monospace; }
    .card p { font-size: 12px; color: var(--muted); margin: 0; }
    .badge { display: inline-block; font-size: 10px; padding: 2px 6px; border-radius: 3px; background: var(--code-bg); color: var(--muted); margin-right: 4px; }
    .count { color: var(--muted); font-size: 12px; margin-left: 8px; }
    .empty { text-align: center; padding: 40px; color: var(--muted); }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .footer { margin-top: 3rem; padding-top: 1.5rem; border-top: 1px solid var(--border); color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <h1>starter-foundry registry explorer</h1>
  <p class="sub">
    Browse every family, capability, and partner in the registry. Type to filter.
    <a href="./playground.html">→ Try the playground</a>
  </p>

  <input type="search" id="filter" placeholder="Filter by id, keyword, or description..." autofocus />

  <div class="tabs">
    <div class="tab active" data-tab="families">Families <span class="count" id="count-families"></span></div>
    <div class="tab" data-tab="capabilities">Capabilities <span class="count" id="count-capabilities"></span></div>
    <div class="tab" data-tab="partners">Partners <span class="count" id="count-partners"></span></div>
  </div>

  <div id="grid-families" class="grid"></div>
  <div id="grid-capabilities" class="grid" style="display:none;"></div>
  <div id="grid-partners" class="grid" style="display:none;"></div>

  <div class="footer">
    <p>
      Source of truth: <a href="https://github.com/tangle-network/starter-foundry/tree/main/registry">registry/</a>
      · Built from: <code id="snap-ts">?</code>
      · Regenerate: <code>node scripts/generate-playground-snapshot.mjs</code>
    </p>
  </div>

  <script type="module">
    const SNAP = './playground-snapshot.json'
    const filter = document.getElementById('filter')
    const tabs = document.querySelectorAll('.tab')
    const grids = {
      families: document.getElementById('grid-families'),
      capabilities: document.getElementById('grid-capabilities'),
      partners: document.getElementById('grid-partners'),
    }
    let snapshot = null

    async function load() {
      try {
        const res = await fetch(SNAP)
        snapshot = await res.json()
        document.getElementById('snap-ts').textContent = snapshot.generatedAt ?? 'unknown'
        document.getElementById('count-families').textContent = snapshot.families.length
        document.getElementById('count-capabilities').textContent = snapshot.capabilities.length
        document.getElementById('count-partners').textContent = snapshot.partners.length
        render()
      } catch (err) {
        for (const g of Object.values(grids)) {
          g.innerHTML = '<div class="empty">Snapshot missing. Run <code>node scripts/generate-playground-snapshot.mjs</code>.</div>'
        }
      }
    }

    function render() {
      if (!snapshot) return
      const q = filter.value.toLowerCase().trim()
      const matches = (item, extraFields = []) => {
        if (!q) return true
        const hay = [item.id, item.description ?? '', ...(item.keywords ?? []), ...extraFields]
          .join(' ')
          .toLowerCase()
        return hay.includes(q)
      }

      const renderCard = (item, kind) => {
        const keywords = (item.keywords ?? []).slice(0, 3)
        return `<div class="card">
          <h3>${item.id}</h3>
          <p>${(item.description ?? '').slice(0, 140)}</p>
          <div style="margin-top:6px;">
            ${keywords.map((k) => `<span class="badge">${k}</span>`).join('')}
          </div>
        </div>`
      }

      grids.families.innerHTML = snapshot.families
        .filter((f) => matches(f))
        .map((f) => renderCard(f, 'family'))
        .join('') || '<div class="empty">No matches.</div>'

      grids.capabilities.innerHTML = snapshot.capabilities
        .filter((c) => matches(c, c.appliesTo ?? []))
        .map((c) => renderCard(c, 'capability'))
        .join('') || '<div class="empty">No matches.</div>'

      grids.partners.innerHTML = snapshot.partners
        .map((p) => `<div class="card"><h3>${p.id}</h3></div>`)
        .filter((html) => !q || html.toLowerCase().includes(q))
        .join('') || '<div class="empty">No matches.</div>'
    }

    filter.addEventListener('input', render)
    tabs.forEach((tab) => {
      tab.addEventListener('click', () => {
        tabs.forEach((t) => t.classList.remove('active'))
        tab.classList.add('active')
        for (const [name, grid] of Object.entries(grids)) {
          grid.style.display = name === tab.dataset.tab ? 'grid' : 'none'
        }
      })
    })

    load()
  </script>
</body>
</html>
