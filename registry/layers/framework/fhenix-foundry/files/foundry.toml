[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.25"
optimizer = true
optimizer_runs = 200

# CoFHE is vendored under lib/cofhe-contracts/contracts/ so `forge build` resolves
# the encrypted-type imports offline. On a real Fhenix deploy, swap this for the
# installed package: "@fhenixprotocol/cofhe-contracts/=node_modules/@fhenixprotocol/cofhe-contracts/contracts/".
remappings = [
  "@fhenixprotocol/cofhe-contracts/=lib/cofhe-contracts/contracts/"
]

# forge lint — `info` severity is naming-convention noise (mixed-case-variable,
# screaming-snake-case-immutable) that real FHE contracts trip on; test/script
# are fixture code where casts + raw arithmetic are routine, not real bugs.
[lint]
severity = ["high", "med", "gas"]
ignore = ["test/**/*", "script/**/*"]

# See more at https://book.getfoundry.sh/reference/config/overview
