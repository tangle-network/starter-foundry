name: Proposal cron

# Runs the self-improvement proposal scripts on a schedule and opens PRs
# for any high-confidence suggestions they emit. Turns the loop from
# "human runs the script, reviews output, opens PR" into "scripts run
# nightly/weekly, PRs land in review queue, human only decides merge."
#
# - propose-capabilities.mjs: detects unmapped package clusters in
#   buildout traces, proposes new capability layers with packageDeps.
# - propose-family.mjs: detects mis-routed-prompt clusters, drafts a
#   new family manifest + files scaffold from N peer families.
# - open-template-prs.mjs: opens PRs for promoted template candidates
#   in .evolve/template-candidates/ (already exists; extended here to
#   consume the proposal outputs).

on:
  schedule:
    # Nightly UTC 04:00 — weekday runs only (skip Sat/Sun to avoid the
    # noise of weekend drift and keep the on-call load on weekdays).
    - cron: '0 4 * * 1-5'
  workflow_dispatch:

concurrency:
  group: proposal-cron
  cancel-in-progress: false

jobs:
  capabilities:
    name: propose + promote capabilities (demand-driven RLM)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: ./.github/actions/setup-agent-eval
      - name: install
        run: pnpm install --frozen-lockfile
      - name: build
        run: pnpm build
      - name: package-cluster-based capability proposals (legacy — no RLM)
        # Original capability proposer that mines npm-dep clusters in
        # buildout traces. Kept alongside the RLM flow because the two
        # catch different gaps (packages-together vs. feature-mentions).
        run: node scripts/propose-capabilities.mjs --out .evolve/proposals/capabilities.json || true
      - name: detect capability gaps + run RLM proposer on top-3 candidates
        env:
          TANGLE_ROUTER_USER_KEY: ${{ secrets.TANGLE_ROUTER_USER_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
        # Demand-driven: detect-capability-gaps finds scenario tokens no
        # existing capability keyword covers, pipes candidates into the
        # RLM capability proposer. Failing is non-fatal — the promoter
        # rejects any TODO drafts at the schema gate downstream.
        run: |
          node scripts/detect-capability-gaps.mjs --json --top 3 \
            | node scripts/propose-capability-candidates.mjs --max-shots 2 \
            || true
      - name: promote capability drafts that pass schema + compose + build
        run: node scripts/promote-capability-proposal.mjs --all || true
      - name: open PRs for promoted capabilities + package-cluster proposals
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/open-proposal-prs.mjs --kind capability --min-confidence 0.75 || true
      - name: upload generation-impact log as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generation-impact-capabilities-${{ github.run_id }}
          path: .evolve/generation-impact.jsonl
          if-no-files-found: ignore
          retention-days: 30

  families:
    name: propose + promote families (demand-driven RLM)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: ./.github/actions/setup-agent-eval
      - name: install
        run: pnpm install --frozen-lockfile
      - name: build
        run: pnpm build
      - name: detect gaps + run RLM proposer on top-3 candidates
        env:
          TANGLE_ROUTER_USER_KEY: ${{ secrets.TANGLE_ROUTER_USER_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # Demand-driven: detect-family-gaps pipes JSON candidates into the
        # RLM proposer. Failing the proposer (LLM unavailable, rate limit)
        # should not fail the job — downstream promoter will reject any
        # deterministic TODO drafts at the schema gate.
        run: |
          node scripts/detect-family-gaps.mjs --json --top 3 \
            | node scripts/propose-family-candidates.mjs --max-shots 2 \
            || true
      - name: promote drafts that pass schema + compose + build gates
        run: node scripts/promote-family-proposal.mjs --all --no-pr || true
      - name: open PRs for promoted families (human review)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # promote-family-proposal.mjs writes promoted.json sentinel in each
        # draft dir on success; open-proposal-prs.mjs consumes that.
        run: node scripts/open-proposal-prs.mjs --kind family --min-confidence 0.75 || true
      - name: upload generation-impact log as artifact (for inspection)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generation-impact-${{ github.run_id }}
          path: .evolve/generation-impact.jsonl
          if-no-files-found: ignore
          retention-days: 30

  template-candidates:
    name: open template candidate PRs
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: ./.github/actions/setup-agent-eval
      - name: install
        run: pnpm install --frozen-lockfile
      - name: build
        run: pnpm build
      - name: open PRs for promotable template candidates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/open-template-prs.mjs --min-score 0.7 || true
