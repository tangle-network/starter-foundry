[project]
name = "tgi-starter"
version = "0.1.0"
description = "HuggingFace TGI client starter"
requires-python = ">=3.11"
dependencies = [
    "huggingface_hub>=0.24.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
include = ["src"]
