name: research

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TANGLE_API_KEY: ${{ secrets.TANGLE_API_KEY }}
      TANGLE_SANDBOX_KEY: ${{ secrets.TANGLE_SANDBOX_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Test
        run: pytest -q

      - name: Sweep (propose -> screen -> validate)
        if: env.TANGLE_API_KEY != '' && env.TANGLE_SANDBOX_KEY != ''
        run: python -m research sweep --reps 5 --top-k 3

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-results
          path: research-results/
          if-no-files-found: ignore
